name: "shareto"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "shareto developers <support@shareto.local>"
description: "Safe and minimal large file distribution tool for Linux"
homepage: "https://github.com/huadaox/shareto"
license: "MIT"

contents:
  - src: ./dist/shareto
    dst: /usr/bin/shareto
    file_info:
      mode: 0755
  - src: ./packaging/shareto.service
    dst: /usr/lib/systemd/user/shareto.service
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinst

depends:
  - systemd

rpm:
  summary: "Safe and minimal large file distribution tool for Linux"
  group: "Applications/System"
